---
- name: Collect Junos MAC tables (read only)
  hosts: mexico_access_switches
  gather_facts: false

  pre_tasks:
    - name: Ensure local raw-data directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../data/raw"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

  tasks:
    - name: Read ethernet switching table
      juniper.device.junos_command:
        commands:
          - show ethernet-switching table
        display: xml
      register: mac_result
      changed_when: false

    - name: Save structured result locally
      ansible.builtin.copy:
        content: "{{ mac_result | to_nice_json }}"
        dest: "{{ playbook_dir }}/../data/raw/{{ inventory_hostname }}.json"
        mode: "0644"
      delegate_to: localhost
      changed_when: false
