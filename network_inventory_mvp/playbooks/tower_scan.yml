---
- name: Collect Junos MAC tables from Tower inventory
  hosts: mexico_access_switches
  gather_facts: false

  vars:
    ansible_connection: ansible.netcommon.netconf
    ansible_network_os: juniper.device.junos
    ansible_port: 830
    scan_id: "{{ tower_job_id | default(awx_job_id | default('manual')) }}"
    scan_root: "/tmp/network_inventory_{{ scan_id }}"

  pre_tasks:
    - name: Create temporary scan directories on the Tower execution node
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ scan_root }}/raw"
        - "{{ scan_root }}/output"
      delegate_to: localhost
      run_once: true
      changed_when: false

  tasks:
    - name: Read ethernet switching table (read only)
      juniper.device.junos_command:
        commands:
          - show ethernet-switching table
        display: xml
      register: mac_result
      changed_when: false

    - name: Store this switch result for the current Tower job
      ansible.builtin.copy:
        content: "{{ mac_result | to_nice_json }}"
        dest: "{{ scan_root }}/raw/{{ inventory_hostname }}.json"
        mode: "0644"
      delegate_to: localhost
      changed_when: false

- name: Compare live state with fixed-PC baseline
  hosts: localhost
  gather_facts: false

  vars:
    scan_id: "{{ tower_job_id | default(awx_job_id | default('manual')) }}"
    scan_root: "/tmp/network_inventory_{{ scan_id }}"
    project_root: "{{ playbook_dir }}/.."

  tasks:
    - name: Compare current MAC locations with baseline inventory
      ansible.builtin.command:
        argv:
          - python3
          - "{{ project_root }}/scripts/compare_inventory.py"
          - --baseline
          - "{{ project_root }}/baseline/inventory.csv"
          - --raw-dir
          - "{{ scan_root }}/raw"
          - --uplinks
          - "{{ project_root }}/baseline/uplinks.csv"
          - --output
          - "{{ scan_root }}/output/current_inventory.csv"
          - --duplicates-output
          - "{{ scan_root }}/output/source_duplicates.csv"
          - --events-output
          - "{{ scan_root }}/output/events.csv"
          - --summary-json
          - "{{ scan_root }}/output/summary.json"
          - --print-events
      register: comparison
      changed_when: false

    - name: Show inventory summary and detected movements in Tower job output
      ansible.builtin.debug:
        msg: "{{ comparison.stdout_lines }}"

    - name: Read summary generated by comparator
      ansible.builtin.slurp:
        src: "{{ scan_root }}/output/summary.json"
      register: summary_file
      changed_when: false

    - name: Parse summary
      ansible.builtin.set_fact:
        network_inventory_summary: "{{ summary_file.content | b64decode | from_json }}"

    - name: Publish summary as Tower job artifact
      ansible.builtin.set_stats:
        data:
          network_inventory_summary: "{{ network_inventory_summary }}"
        per_host: false

    - name: Read movement report
      ansible.builtin.slurp:
        src: "{{ scan_root }}/output/events.csv"
      register: events_file
      changed_when: false

    - name: Publish movement CSV as Tower job artifact
      ansible.builtin.set_stats:
        data:
          network_inventory_events_csv: "{{ events_file.content | b64decode }}"
        per_host: false
