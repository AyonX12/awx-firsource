---
- name: Validate AWX scan input and prepare local workspace
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    scan_id: "{{ tower_job_id | default(awx_job_id | default('manual')) }}"
    scan_root: "/tmp/network_inventory_{{ scan_id }}"

  tasks:
    - name: Require target_hosts to avoid scanning all switches accidentally
      ansible.builtin.assert:
        that:
          - target_hosts is defined
          - target_hosts | string | trim | length > 0
        fail_msg: >-
          target_hosts is required. Examples:
          target_hosts="asw08" or target_hosts="asw08:asw09:asw10"
          or target_hosts="reprise_candidate_switches".

    - name: Require a safe comparison scope
      ansible.builtin.assert:
        that:
          - >-
            (everest_id is defined and everest_id | string | trim | length > 0)
            or
            (full_inventory_scan | default(false) | bool)
        fail_msg: >-
          For a targeted scan provide everest_id.
          For a complete inventory scan set full_inventory_scan=true and make
          target_hosts cover the complete switch scope. This prevents false
          NOT_FOUND results when only a subset of switches is scanned.

    - name: Create temporary scan directories on the AWX execution node
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ scan_root }}/raw"
        - "{{ scan_root }}/output"
      changed_when: false

- name: Collect Junos MAC tables from selected AWX hosts
  hosts: "{{ target_hosts | default('__NO_TARGET_SELECTED__') }}"
  gather_facts: false
  any_errors_fatal: true

  vars:
    # Aligned with the Juniper collection already used by the existing AWX playbooks.
    ansible_connection: ansible.netcommon.netconf
    ansible_network_os: junipernetworks.junos.junos
    ansible_port: 830
    ansible_command_timeout: 120
    ansible_connect_timeout: 15
    scan_id: "{{ tower_job_id | default(awx_job_id | default('manual')) }}"
    scan_root: "/tmp/network_inventory_{{ scan_id }}"

  tasks:
    - name: Read ethernet switching table (read only)
      junipernetworks.junos.junos_command:
        commands:
          - show ethernet-switching table
        display: text
      register: mac_result
      changed_when: false

    - name: Validate MAC table response
      ansible.builtin.assert:
        that:
          - mac_result is defined
          - mac_result.stdout is defined
          - mac_result.stdout | length > 0
        fail_msg: >-
          No ethernet-switching-table output was returned by {{ inventory_hostname }}.
          The scan was stopped to avoid producing an incorrect inventory result.

    - name: Store this switch result for the current AWX job
      ansible.builtin.copy:
        content: "{{ mac_result | to_nice_json }}"
        dest: "{{ scan_root }}/raw/{{ inventory_hostname }}.json"
        mode: "0644"
      delegate_to: localhost
      vars:
        ansible_connection: local
      changed_when: false

- name: Compare live state with fixed-PC baseline
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    scan_id: "{{ tower_job_id | default(awx_job_id | default('manual')) }}"
    scan_root: "/tmp/network_inventory_{{ scan_id }}"
    project_root: "{{ playbook_dir }}/.."

  tasks:
    - name: Build comparator command
      ansible.builtin.set_fact:
        comparator_argv: >-
          {{
            [
              'python3',
              project_root ~ '/scripts/compare_inventory.py',
              '--baseline', project_root ~ '/baseline/inventory.csv',
              '--raw-dir', scan_root ~ '/raw',
              '--uplinks', project_root ~ '/baseline/uplinks.csv',
              '--output', scan_root ~ '/output/current_inventory.csv',
              '--duplicates-output', scan_root ~ '/output/source_duplicates.csv',
              '--events-output', scan_root ~ '/output/events.csv',
              '--summary-json', scan_root ~ '/output/summary.json',
              '--print-events'
            ]
            +
            (
              ['--everest-id', everest_id | string | trim]
              if (everest_id is defined and everest_id | string | trim | length > 0)
              else []
            )
          }}

    - name: Compare current MAC locations with baseline inventory
      ansible.builtin.command:
        argv: "{{ comparator_argv }}"
      register: comparison
      changed_when: false

    - name: Show inventory summary and detected movements in AWX job output
      ansible.builtin.debug:
        msg: "{{ comparison.stdout_lines }}"

    - name: Read summary generated by comparator
      ansible.builtin.slurp:
        src: "{{ scan_root }}/output/summary.json"
      register: summary_file
      changed_when: false

    - name: Parse summary
      ansible.builtin.set_fact:
        network_inventory_summary: "{{ summary_file.content | b64decode | from_json }}"

    - name: Publish summary as AWX job artifact
      ansible.builtin.set_stats:
        data:
          network_inventory_summary: "{{ network_inventory_summary }}"
        per_host: false

    - name: Read movement report
      ansible.builtin.slurp:
        src: "{{ scan_root }}/output/events.csv"
      register: events_file
      changed_when: false

    - name: Publish movement CSV as AWX job artifact
      ansible.builtin.set_stats:
        data:
          network_inventory_events_csv: "{{ events_file.content | b64decode }}"
        per_host: false
