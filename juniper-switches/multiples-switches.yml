---
- name: Allow requested VLANs on selected Junos trunk ports
  hosts: all
  gather_facts: false


  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - vlans_to_add is defined
          - vlans_to_add | string | length > 0
          - interfaces_to_update is defined
          - interfaces_to_update | string | length > 0
        fail_msg: >
          Missing required variables.
          Example:
          vlans_to_add="5,126"
          interfaces_to_update="ge-0/0/10,ge-0/0/11"

    - name: Convert VLAN input string to list
      ansible.builtin.set_fact:
        vlan_list: "{{ vlans_to_add.split(',') | map('trim') | list }}"

    - name: Convert interface input string to list
      ansible.builtin.set_fact:
        interface_list: "{{ interfaces_to_update.split(',') | map('trim') | list }}"

    - name: Validate VLAN IDs
      ansible.builtin.assert:
        that:
          - item | int >= 1
          - item | int <= 4094
        fail_msg: "Invalid VLAN ID: {{ item }}. Valid range is 1-4094."
      loop: "{{ vlan_list }}"

    - name: Validate interface format
      ansible.builtin.assert:
        that:
          - item is match('^(ge|xe|et|mge)-[0-9]+/[0-9]+/[0-9]+$|^ae[0-9]+$')
        fail_msg: "Invalid interface format: {{ item }}"
      loop: "{{ interface_list }}"

  tasks:
    - name: Set backup timestamp
      ansible.builtin.set_fact:
        backup_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    - name: Create local backup directory inside AWX execution pod
      ansible.builtin.file:
        path: "{{ local_backup_path }}/{{ inventory_hostname }}"
        state: directory
        mode: "0777"
      delegate_to: localhost
      become: false

    - name: Backup current Junos configuration
      junipernetworks.junos.junos_config:
        backup: true
        backup_options:
          dir_path: "{{ local_backup_path }}/{{ inventory_hostname }}"
          filename: "{{ inventory_hostname }}_before_vlan_change_{{ backup_timestamp }}.conf"
      register: backup_result

    - name: Build VLAN creation lines
      ansible.builtin.set_fact:
        vlan_config_lines: "{{ vlan_config_lines | default([]) + [
          'set vlans ' ~ vlan_name_prefix ~ item ~ ' vlan-id ' ~ item
        ] }}"
      loop: "{{ vlan_list }}"

    - name: Build trunk interface lines
      ansible.builtin.set_fact:
        trunk_mode_lines: "{{ trunk_mode_lines | default([]) + [
          'set interfaces ' ~ item ~ ' unit ' ~ interface_unit ~ ' family ethernet-switching interface-mode trunk'
        ] }}"
      loop: "{{ interface_list }}"

    - name: Build VLAN member lines for selected interfaces
      ansible.builtin.set_fact:
        vlan_member_lines: "{{ vlan_member_lines | default([]) + [
          'set interfaces ' ~ item.0 ~ ' unit ' ~ interface_unit ~ ' family ethernet-switching vlan members ' ~ item.1
        ] }}"
      loop: "{{ interface_list | product(vlan_list) | list }}"

    - name: Show configuration that will be applied
      ansible.builtin.debug:
        msg:
          - "Switch: {{ inventory_hostname }}"
          - "Interfaces: {{ interface_list }}"
          - "VLANs: {{ vlan_list }}"
          - "Backup: {{ backup_result.backup_path }}"
          - "Config lines:"
          - "{{ vlan_config_lines + trunk_mode_lines + vlan_member_lines }}"

    - name: Apply VLANs to selected trunk ports
      junipernetworks.junos.junos_config:
        lines: "{{ vlan_config_lines + trunk_mode_lines + vlan_member_lines }}"
        comment: "Allowed VLANs {{ vlan_list | join(',') }} on selected trunk ports via AWX"
      register: config_result

    - name: Show result
      ansible.builtin.debug:
        msg:
          - "Switch: {{ inventory_hostname }}"
          - "Backup saved at: {{ backup_result.backup_path }}"
          - "VLANs allowed: {{ vlan_list | join(', ') }}"
          - "Interfaces updated: {{ interface_list | join(', ') }}"