---
- name: Allow requested VLANs on selected Junos ports
  hosts: all
  gather_facts: false

  vars:
    interface_unit: 0
    vlan_name_prefix: "vlan"
    interface_mode: "trunk"
    reset_access_members: true

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - vlans_to_add is defined
          - vlans_to_add | string | length > 0
          - interfaces_to_update is defined
          - interfaces_to_update | string | length > 0
        fail_msg: >
          Missing required variables.
          Example:
          vlans_to_add="5,126"
          interfaces_to_update="ge-0/0/10,ge-0/0/11"
          interface_mode="trunk"

    - name: Normalize interface mode
      ansible.builtin.set_fact:
        selected_interface_mode: "{{ interface_mode | lower | trim }}"

    - name: Validate interface mode
      ansible.builtin.assert:
        that:
          - selected_interface_mode in ['trunk', 'access']
        fail_msg: 'Invalid interface_mode. Valid options are: trunk or access.'

    - name: Convert VLAN input string to list
      ansible.builtin.set_fact:
        vlan_list: "{{ vlans_to_add.split(',') | map('trim') | list }}"

    - name: Convert interface input string to list
      ansible.builtin.set_fact:
        interface_list: "{{ interfaces_to_update.split(',') | map('trim') | list }}"

    - name: Validate access mode only has one VLAN
      ansible.builtin.assert:
        that:
          - selected_interface_mode != 'access' or vlan_list | length == 1
        fail_msg: >
          Access mode only supports one VLAN.
          Example:
          vlans_to_add="5"
          interface_mode="access"

    - name: Validate VLAN IDs
      ansible.builtin.assert:
        that:
          - item | int >= 1
          - item | int <= 4094
        fail_msg: "Invalid VLAN ID: {{ item }}. Valid range is 1-4094."
      loop: "{{ vlan_list }}"

    - name: Validate interface format
      ansible.builtin.assert:
        that:
          - item is match('^(ge|xe|et|mge)-[0-9]+/[0-9]+/[0-9]+$|^ae[0-9]+$')
        fail_msg: "Invalid interface format: {{ item }}"
      loop: "{{ interface_list }}"

  tasks:
    - name: Build VLAN creation lines
      ansible.builtin.set_fact:
        vlan_config_lines: "{{ vlan_config_lines | default([]) + [
          'set vlans ' ~ vlan_name_prefix ~ item ~ ' vlan-id ' ~ item
        ] }}"
      loop: "{{ vlan_list }}"

    - name: Build interface mode lines
      ansible.builtin.set_fact:
        interface_mode_lines: "{{ interface_mode_lines | default([]) + [
          'set interfaces ' ~ item ~ ' unit ' ~ interface_unit ~ ' family ethernet-switching interface-mode ' ~ selected_interface_mode
        ] }}"
      loop: "{{ interface_list }}"

    - name: Build access cleanup lines
      ansible.builtin.set_fact:
        access_cleanup_lines: "{{ access_cleanup_lines | default([]) + [
          'delete interfaces ' ~ item ~ ' unit ' ~ interface_unit ~ ' family ethernet-switching vlan members'
        ] }}"
      loop: "{{ interface_list }}"
      when:
        - selected_interface_mode == 'access'
        - reset_access_members | bool

    - name: Build VLAN member lines for selected interfaces
      ansible.builtin.set_fact:
        vlan_member_lines: "{{ vlan_member_lines | default([]) + [
          'set interfaces ' ~ item.0 ~ ' unit ' ~ interface_unit ~ ' family ethernet-switching vlan members ' ~ item.1
        ] }}"
      loop: "{{ interface_list | product(vlan_list) | list }}"

    - name: Build final configuration lines
      ansible.builtin.set_fact:
        final_config_lines: >-
          {{
            vlan_config_lines
            + (access_cleanup_lines | default([]))
            + interface_mode_lines
            + vlan_member_lines
          }}

    - name: Show configuration that will be applied
      ansible.builtin.debug:
        msg:
          - "Switch: {{ inventory_hostname }}"
          - "Interface mode: {{ selected_interface_mode }}"
          - "Interfaces: {{ interface_list }}"
          - "VLANs: {{ vlan_list }}"
          - "Config lines:"
          - "{{ final_config_lines }}"

    - name: Apply VLANs to selected ports
      junipernetworks.junos.junos_config:
        lines: "{{ final_config_lines }}"
        comment: "Configured VLANs {{ vlan_list | join(',') }} on {{ selected_interface_mode }} ports via AWX"
      register: config_result

    - name: Show result
      ansible.builtin.debug:
        msg:
          - "Switch: {{ inventory_hostname }}"
          - "Mode configured: {{ selected_interface_mode }}"
          - "VLANs allowed: {{ vlan_list | join(', ') }}"
          - "Interfaces updated: {{ interface_list | join(', ') }}"