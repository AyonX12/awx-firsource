---
- name: Allow requested VLANs on selected Junos ports
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false

  pre_tasks:
    - name: Set safe default variables
      ansible.builtin.set_fact:
        effective_interface_unit: "{{ interface_unit | default(0) }}"
        effective_vlan_name_prefix: "{{ vlan_name_prefix | default('vlan') }}"
        selected_interface_mode: "{{ interface_mode | default('trunk') | lower | trim }}"
        effective_reset_access_members: "{{ reset_access_members | default(true) }}"

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - vlans_to_add is defined
          - vlans_to_add | string | length > 0
          - interfaces_to_update is defined
          - interfaces_to_update | string | length > 0
        fail_msg: >
          Missing required variables.
          Examples:
          vlans_to_add="126:Collections_Upstart"
          vlans_to_add="126:Collections_Upstart,130:Guest_WiFi"
          interfaces_to_update="ge-0/0/10,ge-0/0/11"
          interface_mode="trunk"

    - name: Validate interface mode
      ansible.builtin.assert:
        that:
          - selected_interface_mode in ['trunk', 'access']
        fail_msg: "Invalid interface_mode. Valid options are: trunk or access."

    - name: Convert VLAN input string to raw entry list
      ansible.builtin.set_fact:
        vlan_raw_entry_list: "{{ vlans_to_add.split(',') | map('trim') | reject('equalto', '') | list }}"

    - name: Validate VLAN input format
      ansible.builtin.assert:
        that:
          - item is match('^[0-9]{1,4}(:[A-Za-z0-9_.-]+)?$')
        fail_msg: >
          Invalid VLAN input: {{ item }}.
          Valid examples:
          126
          126:Collections_Upstart
          VLAN names cannot contain spaces. Use underscores or hyphens.
      loop: "{{ vlan_raw_entry_list }}"

    - name: Initialize VLAN parsing variables
      ansible.builtin.set_fact:
        vlan_list: []
        requested_vlan_custom_name_map: {}

    - name: Build VLAN ID list from input
      ansible.builtin.set_fact:
        vlan_list: "{{ vlan_list + [ item.split(':')[0] | trim ] }}"
      loop: "{{ vlan_raw_entry_list }}"

    - name: Build requested custom VLAN name map from input
      ansible.builtin.set_fact:
        requested_vlan_custom_name_map: >-
          {{
            requested_vlan_custom_name_map
            | combine({
                (item.split(':')[0] | trim): (item.split(':')[1] | trim)
              })
          }}
      loop: "{{ vlan_raw_entry_list }}"
      when: "':' in item"

    - name: Validate duplicate VLAN IDs in input
      ansible.builtin.assert:
        that:
          - vlan_list | unique | length == vlan_list | length
        fail_msg: >
          Duplicate VLAN IDs were found in vlans_to_add.
          Current VLAN list: {{ vlan_list }}

    - name: Convert interface input string to list
      ansible.builtin.set_fact:
        interface_list: "{{ interfaces_to_update.split(',') | map('trim') | reject('equalto', '') | list }}"

    - name: Validate access mode only has one VLAN
      ansible.builtin.assert:
        that:
          - selected_interface_mode != 'access' or vlan_list | length == 1
        fail_msg: >
          Access mode only supports one VLAN.
          Example:
          vlans_to_add="126:Collections_Upstart"
          interface_mode="access"

    - name: Validate VLAN IDs
      ansible.builtin.assert:
        that:
          - item | int >= 1
          - item | int <= 4094
        fail_msg: "Invalid VLAN ID: {{ item }}. Valid range is 1-4094."
      loop: "{{ vlan_list }}"

    - name: Validate interface format
      ansible.builtin.assert:
        that:
          - item is match('^(ge|xe|et|mge)-[0-9]+/[0-9]+/[0-9]+$|^ae[0-9]+$')
        fail_msg: "Invalid interface format: {{ item }}"
      loop: "{{ interface_list }}"

  tasks:
    - name: Initialize configuration variables
      ansible.builtin.set_fact:
        vlan_id_name_map: {}
        vlan_name_id_map: {}
        requested_vlan_name_map: {}
        missing_vlan_ids: []
        vlan_name_conflict_map: {}
        vlan_config_lines: []
        access_cleanup_lines: []
        interface_mode_lines: []
        vlan_member_lines: []
        final_config_lines: []

    - name: Gather existing VLANs from Junos
      junipernetworks.junos.junos_vlans:
        state: gathered
      register: gathered_vlans_result

    - name: Build VLAN ID to name map from gathered VLANs
      ansible.builtin.set_fact:
        vlan_id_name_map: "{{ vlan_id_name_map | combine({ (item.vlan_id | string): item.name }) }}"
        vlan_name_id_map: "{{ vlan_name_id_map | combine({ item.name: (item.vlan_id | string) }) }}"
      loop: "{{ gathered_vlans_result.gathered | default([]) }}"
      when:
        - item.vlan_id is defined
        - item.name is defined

    - name: Stop if VLAN detection failed
      ansible.builtin.assert:
        that:
          - vlan_id_name_map | length > 0
        fail_msg: >
          VLAN detection failed on {{ inventory_hostname }}.
          The playbook will not continue because it could create a duplicate VLAN ID.
          Review the output of junos_vlans gathered before applying changes.

    - name: Detect missing VLAN IDs
      ansible.builtin.set_fact:
        missing_vlan_ids: "{{ vlan_list | difference(vlan_id_name_map.keys() | list) }}"

    - name: Build requested VLAN name map
      ansible.builtin.set_fact:
        requested_vlan_name_map: >-
          {{
            requested_vlan_name_map
            | combine({
                item: vlan_id_name_map[item]
                      | default(
                          requested_vlan_custom_name_map[item]
                          | default(effective_vlan_name_prefix ~ item)
                        )
              })
          }}
      loop: "{{ vlan_list }}"

    - name: Detect requested VLAN name conflicts for new VLANs
      ansible.builtin.set_fact:
        vlan_name_conflict_map: >-
          {{
            vlan_name_conflict_map
            | combine({
                item: {
                  'requested_name': requested_vlan_name_map[item],
                  'existing_vlan_id_with_same_name': vlan_name_id_map[requested_vlan_name_map[item]]
                }
              })
          }}
      loop: "{{ missing_vlan_ids }}"
      when:
        - requested_vlan_name_map[item] in (vlan_name_id_map.keys() | list)

    - name: Stop if requested VLAN name already exists with another VLAN ID
      ansible.builtin.assert:
        that:
          - vlan_name_conflict_map | length == 0
        fail_msg: >
          VLAN name conflict detected on {{ inventory_hostname }}.
          One or more new VLAN names already exist with another VLAN ID.
          Conflict details: {{ vlan_name_conflict_map }}

    - name: Show VLAN validation result
      ansible.builtin.debug:
        msg:
          - "Switch: {{ inventory_hostname }}"
          - "Requested VLAN input: {{ vlan_raw_entry_list }}"
          - "Requested VLAN IDs: {{ vlan_list | join(', ') }}"
          - "Requested custom VLAN names: {{ requested_vlan_custom_name_map }}"
          - "Detected existing VLAN ID to name map: {{ vlan_id_name_map }}"
          - "VLAN names that will be used: {{ requested_vlan_name_map }}"
          - "Missing VLANs that will be created: {{ missing_vlan_ids | join(', ') if missing_vlan_ids | length > 0 else 'None' }}"

    - name: Build VLAN creation lines only for missing VLANs
      ansible.builtin.set_fact:
        vlan_config_lines: "{{ vlan_config_lines + [
          'set vlans ' ~ requested_vlan_name_map[item] ~ ' vlan-id ' ~ item
        ] }}"
      loop: "{{ missing_vlan_ids }}"
      when:
        - missing_vlan_ids | length > 0

    - name: Build interface mode lines
      ansible.builtin.set_fact:
        interface_mode_lines: "{{ interface_mode_lines + [
          'set interfaces ' ~ item ~ ' unit ' ~ effective_interface_unit ~ ' family ethernet-switching interface-mode ' ~ selected_interface_mode
        ] }}"
      loop: "{{ interface_list }}"

    - name: Build access cleanup lines
      ansible.builtin.set_fact:
        access_cleanup_lines: "{{ access_cleanup_lines + [
          'delete interfaces ' ~ item ~ ' unit ' ~ effective_interface_unit ~ ' family ethernet-switching vlan members',
          'delete interfaces ' ~ item ~ ' unit ' ~ effective_interface_unit ~ ' family ethernet-switching native-vlan-id'
        ] }}"
      loop: "{{ interface_list }}"
      when:
        - selected_interface_mode == 'access'
        - effective_reset_access_members | bool

    - name: Build VLAN member lines for selected interfaces
      ansible.builtin.set_fact:
        vlan_member_lines: "{{ vlan_member_lines + [
          'set interfaces ' ~ item.0 ~ ' unit ' ~ effective_interface_unit ~ ' family ethernet-switching vlan members ' ~ requested_vlan_name_map[item.1]
        ] }}"
      loop: "{{ interface_list | product(vlan_list) | list }}"

    - name: Build final configuration lines
      ansible.builtin.set_fact:
        final_config_lines: >-
          {{
            vlan_config_lines
            + access_cleanup_lines
            + interface_mode_lines
            + vlan_member_lines
          }}

    - name: Show configuration that will be applied
      ansible.builtin.debug:
        msg:
          - "Switch: {{ inventory_hostname }}"
          - "Interface mode: {{ selected_interface_mode }}"
          - "Interfaces: {{ interface_list }}"
          - "Requested VLAN IDs: {{ vlan_list }}"
          - "VLAN names that will be used: {{ requested_vlan_name_map }}"
          - "Existing VLAN ID to name map: {{ vlan_id_name_map }}"
          - "New VLANs to create: {{ missing_vlan_ids if missing_vlan_ids | length > 0 else 'None' }}"
          - "Config lines:"
          - "{{ final_config_lines }}"

    - name: Safety check to avoid duplicate VLAN creation
      ansible.builtin.assert:
        that:
          - vlan_list | difference((vlan_id_name_map.keys() | list) + missing_vlan_ids) | length == 0
          - vlan_name_conflict_map | length == 0
        fail_msg: >
          Safety validation failed on {{ inventory_hostname }}.
          The playbook detected a possible VLAN validation issue before commit.

    - name: Apply VLANs to selected ports
      junipernetworks.junos.junos_config:
        lines: "{{ final_config_lines }}"
        comment: >-
          Configured VLAN IDs {{ vlan_list | join(',') }} on {{ selected_interface_mode }} ports via AWX.
          Created VLANs: {{ missing_vlan_ids | join(',') if missing_vlan_ids | length > 0 else 'none' }}.
      register: config_result

    - name: Show result
      ansible.builtin.debug:
        msg:
          - "Switch: {{ inventory_hostname }}"
          - "Mode configured: {{ selected_interface_mode }}"
          - "VLAN IDs requested: {{ vlan_list | join(', ') }}"
          - "VLAN names used: {{ requested_vlan_name_map }}"
          - "VLANs created: {{ missing_vlan_ids | join(', ') if missing_vlan_ids | length > 0 else 'None' }}"
          - "Interfaces updated: {{ interface_list | join(', ') }}"